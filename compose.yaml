# Use root/example as user/password credentials

services:

  db:
    container_name: framelab_desktop-db
    image: mariadb
    restart: no
    environment:
      MARIADB_ROOT_PASSWORD: example
    volumes:
      - /home/Antoine/Docker/FrameLab Desktop:/var/lib/mysql:Z
    ports:
      - 3310:3306

  adminer:
    container_name: framelab_desktop-adminer
    image: adminer
    restart: no
    ports:
      - 8084:8080

